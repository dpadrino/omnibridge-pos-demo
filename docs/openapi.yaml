  /admin/login:
    get:
      summary: Login administrativo local o instrucciones de configuración inicial
      security: []
      responses:
        '200':
          description: HTML sin secretos ni inventario de hardware; formulario deshabilitado sin clave válida.
          content:
            text/html:
              schema:
                type: string
        '403':
          description: Bind no loopback u Origin externo.
  /admin/session:
    post:
      summary: Iniciar sesión administrativa local
      description: Requiere Origin local del puerto principal; JSON máximo 1024 bytes. Cinco intentos por minuto y hasta 16 sesiones globales por proceso.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [admin_key]
              properties:
                admin_key:
                  type: string
                  minLength: 32
                  maxLength: 256
                  writeOnly: true
      responses:
        '200':
          description: Cookie de sesión aleatoria; caducidad absoluta 1800 segundos.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: omnibridge_admin_session; HttpOnly; SameSite=Strict; Path=/; Max-Age=1800. HTTP loopback, no Secure.
          content:
            application/json:
              schema:
                type: object
                required: [status, expires_in]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  expires_in:
                    type: integer
                    enum: [1800]
        '400':
          description: JSON inválido.
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '413':
          description: JSON excede 1024 bytes.
        '422':
          description: Campos JSON ausentes, desconocidos o de tipo incorrecto.
        '429':
          description: Límite global de intentos o sesiones alcanzado.
        '500':
          description: No se pudo obtener entropía del sistema operativo.
    delete:
      summary: Revocar la sesión enviada en la cookie
      description: Reiniciar también revoca todas las sesiones; cookies de otros navegadores no se revocan al cerrar una sesión.
      security: &adminSecurity
        - AdminSession: []
        - AdminBearer: []
        - AdminApiKey: []
      responses:
        '200':
          description: Sesión revocada y cookie eliminada con Max-Age=0.
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
  /api/v1/config:
    get:
      summary: Configuración administrativa y hardware detectado
      security: *adminSecurity
      responses:
        '200':
          description: config es el estado activo; saved_config contiene valores guardados (o activos si aun no existe archivo). restart_required indica diferencias, incluidas credenciales, sin exponerlas. api_key y admin_key enmascaradas.
        '500':
          description: No se pudo leer el archivo guardado; no se utiliza fallback si existe pero es invalido o ilegible.
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
    post:
      summary: Guardar campos de configuración soportados
      description: Los 35 campos no secretos son editables. Cambios parciales, validados antes de escribir, sobre el archivo de origen del proceso. No permite editar credenciales. Requiere reinicio para activar cambios; lecturas y escrituras se serializan dentro del agente.
      security: *adminSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdate'
      responses:
        '200':
          description: config contiene los valores guardados sanitizados; active_config conserva los activos. restart_required indica diferencias; restart_recommended se mantiene por compatibilidad.
        '400':
          description: Configuración inválida.
        '422':
          description: JSON invalido, campo desconocido (incluidas credenciales) o tipo incorrecto.
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          description: Fallo de persistencia.
  /config:
    $ref: '#/paths/~1api~1v1~1config'
  /api/v1/license:
    get:
      summary: Consultar licencia y titular
      security: *adminSecurity
      responses:
        '200':
          description: Estado de licencia, plan, titular y vigencia.
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
    post:
      summary: Activar licencia
      security: *adminSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key]
              properties:
                license_key:
                  type: string
                  writeOnly: true
      responses:
        '200':
          description: Licencia activada.
        '400':
          description: Licencia inválida.
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          description: Fallo al persistir la licencia.
  /license:
    $ref: '#/paths/~1api~1v1~1license'
  /api/v1/printers/test-page:
    post:
      summary: Página administrativa de prueba de impresora
      security: *adminSecurity
      parameters:
        - name: printer
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: simulate
          in: query
          schema:
            type: boolean
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                printer:
                  type: string
                type:
                  type: string
                simulate:
                  type: boolean
                mock:
                  type: boolean
      responses:
        '200':
          description: Prueba despachada o simulada explícitamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterTestPageResponse'
        '400':
          $ref: '#/components/responses/InvalidPrintRequest'
        '503':
          $ref: '#/components/responses/DispatchBusy'
        '504':
          $ref: '#/components/responses/RawDispatchTimeout'
        '500':
          $ref: '#/components/responses/PrintDispatchFailure'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
  /printers/test-page:
    $ref: '#/paths/~1api~1v1~1printers~1test-page'
  /impresoras/prueba:
    $ref: '#/paths/~1api~1v1~1printers~1test-page'
  /api/v1/printers/cleanup:
    $ref: '#/paths/~1printers~1cleanup'
  /printers/purge:
    $ref: '#/paths/~1printers~1cleanup'
  /impresoras/purgar:
    $ref: '#/paths/~1printers~1cleanup'
  /api/v1/biometric/enroll:
    $ref: '#/paths/~1biometric~1enroll'
  /api/v1/health/live:
    get:
      summary: Disponibilidad mínima pública del proceso HTTP
      description: No consulta periféricos ni verifica readiness. Sigue sujeto a la política de Origin.
      security: []
      tags:
        - Mantenimiento y Diagnóstico
      responses:
        '200':
          description: El proceso HTTP responde.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        '403':
          description: Origin no autorizado.
  /:
    get:
      summary: Panel Visual de Autodiagnóstico (Dashboard HTML)
      security: *adminSecurity
      description: Retorna una interfaz gráfica web embebida con semáforos de conexión, lectura de peso en vivo y botones de prueba.
      tags:
        - Mantenimiento y Diagnóstico
      responses:
        '303':
          description: Sin autenticación, redirige a /admin/login.
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '200':
          description: Panel web interactivo cargado exitosamente.
          content:
            text/html:
              schema:
                type: string

  /peso:
    get:
      summary: Obtener Peso de la Báscula (Alias en Español)
      description: |
        Retorna el peso actual capturado desde la báscula física real en el puerto serial COM/USB.
        En producción (`simulation_mode = false`), si no hay báscula física conectada, retorna HTTP 503 (CERO falsos positivos).
        Los parámetros `simulate`, `mock`, `test`, `weight`, `unit` y `stable` solo se aceptan cuando `simulation_mode = true`; en caso contrario retornan HTTP 403.
        Una unidad inválida o un peso negativo/no finito retorna HTTP 400. La secuencia simulada se convierte de kg a lb; un peso fijo se interpreta en la unidad pedida.
      tags:
        - Báscula (Scale)
      parameters:
        - name: simulate
          in: query
          required: false
          schema:
            type: boolean
          description: Activa emulación solo cuando simulation_mode=true en el agente.
        - name: mock
          in: query
          required: false
          schema:
            type: boolean
          description: Alias de simulate; requiere simulation_mode=true.
        - name: test
          in: query
          required: false
          schema:
            type: boolean
          description: Alias de simulación, disponible solo con simulation_mode=true.
        - name: weight
          in: query
          required: false
          schema:
            type: number
            format: float
            minimum: 0
          description: Peso de prueba finito y no negativo; su unidad es la indicada en unit.
        - name: unit
          in: query
          required: false
          schema:
            type: string
            enum: [kg, lb]
            default: kg
          description: Unidad para simulación. La secuencia de prueba en kg se convierte a lb.
        - name: stable
          in: query
          required: false
          schema:
            type: boolean
          description: Indicador controlable únicamente en lecturas simuladas.
      responses:
        '200':
          description: Lectura de peso exitosa (física o emulada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeightResponse'
              example:
                peso: 1.250
                peso_leido: "01.250"
                puerto: "COM3"
                is_simulated: false
                unit: "kg"
                is_stable: false
        '400':
          description: Unidad o peso simulado inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: La simulación está deshabilitada en esta configuración.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: No se detectó ninguna báscula física conectada (protección contra falsos positivos).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: "error"
                message: "Error de puerto serial en báscula: No se detectó báscula física conectada. Verifique la conexión USB/Serial."

  /weight:
    get:
      summary: Get Scale Weight (English endpoint)
      description: English alias for `/peso`. Simulation controls are rejected with HTTP 403 unless `simulation_mode=true`; invalid units and weights return HTTP 400.
      tags:
        - Báscula (Scale)
      parameters:
        - name: simulate
          in: query
          required: false
          schema:
            type: boolean
        - name: mock
          in: query
          required: false
          schema:
            type: boolean
        - name: test
          in: query
          required: false
          schema:
            type: boolean
        - name: weight
          in: query
          required: false
          schema:
            type: number
            format: float
            minimum: 0
        - name: unit
          in: query
          required: false
          schema:
            type: string
            enum: [kg, lb]
            default: kg
          description: Unidad simulada; use solo con simulation_mode=true.
        - name: stable
          in: query
          required: false
          schema:
            type: boolean
          description: Indicador configurable solo para lecturas simuladas.
      responses:
        '200':
          description: Weight reading successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeightResponse'
        '503':
          description: Scale not connected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid simulation weight or unit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Simulation disabled in this configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ticket:
    post:
      summary: Impresión Inteligente y Unificada de Ticket (JSON / Multipart / Texto)
      description: |
        Endpoint universal para emitir tickets desde frontend web o backend.
        Soporta:
        - JSON: `{"content": "..."}`, `{"text": "..."}` o `{"url": "https://..."}`
        - Multipart: `file=@ticket.pdf`
        - Texto plano UTF-8 con Content-Type: text/plain
        JSON malformado, de tipo incorrecto o sin url/content/text/raw devuelve 400 sin despacho.
        Prioridad JSON: url, luego content, text y raw. No se convierte JSON inválido en texto.
        En RAW Unix, éxito significa aceptación del despacho, no salida física.
      tags:
        - Tickets POS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: Texto o comandos ESC/POS a imprimir en el ticket.
                text:
                  type: string
                  description: Alias alternativo de content.
                raw:
                  type: string
                  description: Alias de texto RAW UTF-8; no es un cuerpo binario arbitrario.
                url:
                  type: string
                  description: URL final remota que responde directamente con PDF; no se siguen redirects.
                printer:
                  type: string
                  description: Nombre de la impresora específica (opcional).
                sumatra_print_settings:
                  type: string
                  description: Ajuste para tickets PDF; por defecto noscale.
              anyOf:
                - required: [url]
                - required: [content]
                - required: [text]
                - required: [raw]
            example:
              content: "TIENDA DEMO\nTicket de Venta #001\nTotal: $15.50\nGracias por su compra!\n"
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                printer:
                  type: string
                sumatra_print_settings:
                  type: string
          text/plain:
            schema:
              type: string
      responses:
        '400':
          $ref: '#/components/responses/InvalidPrintRequest'
        '200':
          description: Ticket despachado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintResponse'
        '500':
          $ref: '#/components/responses/RawDispatchFailure'
        '503':
          $ref: '#/components/responses/DispatchBusy'
        '504':
          $ref: '#/components/responses/RawDispatchTimeout'

  /drawer:
    post:
      summary: Abrir Gaveta de Dinero (Cash Drawer RJ11/RJ12)
      description: |
        Envía el pulso de apertura estándar ESC/POS (Pin 2 y Pin 5) a la impresora térmica de tickets
        para accionar el solenoide de la gaveta de dinero física sin imprimir papel.
        En Unix, éxito confirma despacho del pulso, no movimiento físico de gaveta.
      tags:
        - Gaveta de Dinero (Cash Drawer)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                printer:
                  type: string
                  description: Impresora a la que está conectada la gaveta (opcional, usa la ticketera predeterminada).
                simulate:
                  type: boolean
                mock:
                  type: boolean
                test:
                  type: boolean
      responses:
        '400':
          $ref: '#/components/responses/InvalidPrintRequest'
        '200':
          description: Pulso de apertura enviado con éxito a la gaveta de dinero.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrawerResponse'
        '500':
          $ref: '#/components/responses/RawDispatchFailure'
        '503':
          $ref: '#/components/responses/DispatchBusy'
        '504':
          $ref: '#/components/responses/RawDispatchTimeout'
  /gaveta:
    $ref: '#/paths/~1drawer'
  /print:
    $ref: '#/paths/~1ticket'

  /impresora:
    $ref: '#/paths/~1ticket'

  /print/url:
    post:
      summary: Imprimir Ticket PDF desde URL Remota
      description: Descarga el PDF desde la URL final proporcionada y lo envía silenciosamente a la impresora térmica. Las respuestas de redirección se rechazan.
      tags:
        - Tickets POS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                  description: URL HTTP(S) final que responde directamente con el archivo PDF. Las redirecciones se rechazan.
                  example: "https://mi-erp.com/invoices/1054/pdf"
                printer:
                  type: string
                  description: Nombre de la impresora (opcional).
                  example: "POS-80"
                sumatra_print_settings:
                  type: string
                  description: Ajuste de escala del ticket PDF; por defecto noscale.
      responses:
        '400':
          $ref: '#/components/responses/InvalidPrintRequest'
        '500':
          $ref: '#/components/responses/PrintDispatchFailure'
        '504':
          $ref: '#/components/responses/RawDispatchTimeout'
        default:
          $ref: '#/components/responses/RequestFailure'
        '200':
          description: Documento descargado e impreso satisfactoriamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintResponse'
        '503':
          $ref: '#/components/responses/DispatchBusy'

  /impresora/url:
    $ref: '#/paths/~1print~1url'

  /print-label:
    post:
      summary: Imprimir Etiqueta RAW (TSPL / ZPL)
      description: Envía instrucciones RAW (TSPL / ZPL / ESC-POS) mediante Direct USB/Spooler en Windows o lpr -l (lp -o raw si lpr no está instalado) en Linux/macOS. Éxito confirma despacho, no salida física.
      tags:
        - Etiquetas (Labels)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelPrintRequest'
            example:
              language: "TSPL"
              printer: "3nStar 4B-2054L"
              commands: "SIZE 60 mm,45 mm\r\nGAP 3 mm,0 mm\r\nCLS\r\nTEXT 50,40,\"3\",0,1,1,\"OMNIBRIDGE POS\"\r\nBARCODE 50,110,\"128\",60,1,0,2,2,\"759123456789\"\r\nPRINT 1,1\r\n"
      responses:
        '200':
          description: Etiqueta enviada correctamente a la impresora.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelPrintResponse'
        '500':
          $ref: '#/components/responses/RawDispatchFailure'
        '503':
          $ref: '#/components/responses/DispatchBusy'
        '504':
          $ref: '#/components/responses/RawDispatchTimeout'
    get:
      summary: Consultar Estado del Servicio de Etiquetas
      description: Retorna el estado del servicio TSPL y el nombre de la impresora de etiquetas detectada en el sistema.
      tags:
        - Etiquetas (Labels)
      responses:
        '200':
          description: Servicio activo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
                  port:
                    type: integer
                  detectedPrinter:
                    type: string
                  message:
                    type: string

  /impresora/etiqueta:
    post:
      summary: Imprimir Etiqueta RAW (Alias en Español)
      tags:
        - Etiquetas (Labels)
      requestBody:
        $ref: '#/paths/~1print-label/post/requestBody'
      responses:
        '200':
          $ref: '#/paths/~1print-label/post/responses/200'
        '500':
          $ref: '#/components/responses/RawDispatchFailure'
        '503':
          $ref: '#/components/responses/DispatchBusy'
        '504':
          $ref: '#/components/responses/RawDispatchTimeout'

  /print-matrix:
    post:
      summary: Imprimir en Forma Continua / Matriz de Punto (Texto RAW / ESC-P)
      description: Envía texto plano o comandos ESC/P directamente a la impresora de agujas en modo RAW con soporte opcional de Form Feed (\x0c). En Unix, éxito confirma aceptación del despacho, no impresión física.
      tags:
        - Forma Continua / Matriz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatrixPrintRequest'
            example:
              text: "========================================\r\nNOTA DE ENTREGA #1045\r\n========================================\r\n01 Cemento Gris x 42.5kg      $12.50\r\n02 Cabilla 1/2 pulgada         $8.00\r\n----------------------------------------\r\nTOTAL:                        $20.50\r\n"
              printer: "Generic / Text Only"
              form_feed: true
      responses:
        '200':
          description: Impresión despachada exitosamente a la impresora de matriz.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatrixPrintResponse'
        '500':
          $ref: '#/components/responses/RawDispatchFailure'
        '503':
          $ref: '#/components/responses/DispatchBusy'
        '504':
          $ref: '#/components/responses/RawDispatchTimeout'
    get:
      summary: Consultar Estado e Impresora de Matriz Detectada
      description: Retorna el estado del servicio y la impresora de forma continua seleccionada.
      tags:
        - Forma Continua / Matriz
      responses:
        '200':
          description: Estado del servicio retornado.

  /impresora/matriz:
    post:
      summary: Imprimir en Forma Continua / Matriz de Punto (Alias en Español)
      tags:
        - Forma Continua / Matriz
      requestBody:
        $ref: '#/paths/~1print-matrix/post/requestBody'
      responses:
        '200':
          $ref: '#/paths/~1print-matrix/post/responses/200'
        '500':
          $ref: '#/components/responses/RawDispatchFailure'
        '503':
          $ref: '#/components/responses/DispatchBusy'
        '504':
          $ref: '#/components/responses/RawDispatchTimeout'

  /api/v1/print/document:
    post:
      summary: Imprimir Documento de Oficina en Impresora Láser / Inyección (Multipart)
      description: |
        Recibe un archivo PDF o TXT de tamaño completo (Carta / A4 / Legal) y lo envía a la impresora láser con ajuste automático de escala (`fit`).
        
        **IMPORTANTE (Condición Word/Excel):** Los archivos Microsoft Word (`.docx`, `.doc`) y Excel (`.xlsx`, `.xls`) NO se imprimen de forma directa en servicios desatendidos. El ERP o backend debe exportarlos o convertirlos a PDF (o `.txt`) antes de enviarlos al agente. Subir un archivo de Office retornará HTTP 400 Bad Request.
      tags:
        - Documentos / Láser
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo PDF o documento TXT a imprimir. (Archivos .docx y .xlsx deben convertirse a PDF en el servidor previo al envío).
                printer:
                  type: string
                  description: Nombre de la impresora láser destino. Si se omite, auto-detecta la mejor láser/multifuncional activa.
                settings:
                  type: string
                  description: Configuración de escala de página en SumatraPDF (ej. `fit`, `shrink`, `noscale`).
                  default: "fit"
      responses:
        '200':
          description: Documento impreso exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintResponse'
        '503':
          $ref: '#/components/responses/DispatchBusy'
    get:
      summary: Consultar Estado e Impresora Láser / Documentos Detectada
      tags:
        - Documentos / Láser
      responses:
        '200':
          description: Estado del servicio de documentos y nombre de la impresora detectada.

  /api/v1/print/document/url:
    post:
      summary: Imprimir Documento desde URL Remota o Contenido de Texto
      description: Descarga un PDF desde su URL final directa o recibe texto plano para imprimir. Las redirecciones HTTP se rechazan. Solo admite JSON en esta ruta; text_content tiene prioridad sobre url.
      tags:
        - Documentos / Láser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: URL HTTP(S) final que responde directamente con el documento PDF.
                  example: "https://mi-erp.com/reporte-cierre-caja.pdf"
                text_content:
                  type: string
                  description: Contenido de texto plano si no se usa PDF.
                printer:
                  type: string
                  example: "HP LaserJet Pro MFP"
                settings:
                  type: string
                  default: "fit"
                  example: "fit"
              anyOf:
                - required: [text_content]
                - required: [url]
      responses:
        '400':
          $ref: '#/components/responses/InvalidPrintRequest'
        '500':
          $ref: '#/components/responses/PrintDispatchFailure'
        '504':
          $ref: '#/components/responses/RawDispatchTimeout'
        default:
          $ref: '#/components/responses/RequestFailure'
        '200':
          description: Documento enviado a la impresora láser.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintResponse'
        '503':
          $ref: '#/components/responses/DispatchBusy'

  /impresora/documento:
    $ref: '#/paths/~1api~1v1~1print~1document'

  /printers:
    get:
      summary: Listar Catálogo Detallado de Impresoras
      description: Retorna todas las impresoras instaladas en el sistema operativo con detalle de flags (is_pos, is_label, is_default, is_ready, status).
      tags:
        - Mantenimiento y Diagnóstico
      responses:
        '200':
          description: Catálogo obtenido exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintersResponse'

  /impresoras:
    get:
      summary: Listar Catálogo Detallado de Impresoras (Alias en Español)
      tags:
        - Mantenimiento y Diagnóstico
      responses:
        '200':
          $ref: '#/paths/~1printers/get/responses/200'

  /printers/cleanup:
    post:
      summary: Purgar Trabajos Trabados del Spooler de Windows
      security: *adminSecurity
      description: Elimina los trabajos pendientes o atascados en la cola de impresión de Windows para restaurar el flujo de impresión.
      tags:
        - Mantenimiento y Diagnóstico
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                printer:
                  type: string
                  description: Nombre de la impresora específica a purgar (si se omite, purga todas).
      responses:
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '200':
          description: Cola purgada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintResponse'
        '503':
          $ref: '#/components/responses/DispatchBusy'

  /impresoras/limpiar:
    $ref: '#/paths/~1printers~1cleanup'

  /health:
    get:
      summary: Estado Integral de Salud del Agente
      description: Diagnóstico completo de puertos seriales, impresora predeterminada, etiquetadora y spooler.
      tags:
        - Mantenimiento y Diagnóstico
      responses:
        '401':
          description: En modo red, API key ausente, incorrecta o no configurada.
        '200':
          description: Estado de salud retornado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /status:
    get:
      summary: Estado Integral de Salud (Alias)
      tags:
        - Mantenimiento y Diagnóstico
      responses:
        '401':
          $ref: '#/paths/~1health/get/responses/401'
        '200':
          $ref: '#/paths/~1health/get/responses/200'

  /biometric/health:
    get:
      summary: Estado de Salud del Dispositivo Biométrico
      description: >
        También aplica a los aliases /biometric/status, /api/v1/biometric/health
        y /api/v1/biometric/status. USB no tiene detección ni captura implementadas.
        La conexión de red requiere ACK ZK válido; no certifica modelos físicos.
        Los datos no consultados se devuelven como null, no como valores inventados.
      tags:
        - Biométrico y Control de Asistencia
      responses:
        '401':
          $ref: '#/paths/~1health/get/responses/401'
        '200':
          description: Estado del reloj checador o captahuellas
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, disabled, unsupported]
                    example: ok
                  biometric:
                    type: object
                    properties:
                      connected:
                        type: boolean
                        example: true
                      enrollment_supported:
                        type: boolean
                        example: false
                      attendance_supported:
                        type: boolean
                        description: Lectura TCP de registros de 40 bytes, no transferencia por bloques
                      is_simulated:
                        type: boolean
                        example: false
                      device_type:
                        type: string
                        example: network_clock
                      ip:
                        type: string
                        nullable: true
                        example: "192.168.1.201"
                      port:
                        type: integer
                        nullable: true
                        example: 4370
                      serial_number:
                        type: string
                        nullable: true
                      firmware:
                        type: string
                        nullable: true
                      user_count:
                        type: integer
                        nullable: true
                      log_count:
                        type: integer
                        nullable: true
                      last_sync:
                        type: string
                        format: date-time
                        nullable: true
        '500':
          $ref: '#/components/responses/BiometricFailure'
        '501':
          $ref: '#/components/responses/BiometricFailure'
        '503':
          $ref: '#/components/responses/BiometricFailure'
        '504':
          $ref: '#/components/responses/BiometricFailure'

  /biometric/status:
    get:
      summary: Estado del Dispositivo Biométrico (Alias)
      tags:
        - Biométrico y Control de Asistencia
      responses:
        '401':
          $ref: '#/paths/~1health/get/responses/401'
        '200':
          $ref: '#/paths/~1biometric~1health/get/responses/200'
        '500':
          $ref: '#/components/responses/BiometricFailure'
        '501':
          $ref: '#/components/responses/BiometricFailure'
        '503':
          $ref: '#/components/responses/BiometricFailure'
        '504':
          $ref: '#/components/responses/BiometricFailure'

  /biometric/enroll:
    post:
      summary: Enrolar Huella Dactilar de Empleado
      description: >
        Contrato reservado (también /api/v1/biometric/enroll). Los adaptadores
        actuales USB y red devuelven 501, sin plantilla ni captura simulada.
        Esta API no persiste plantillas. Servicio deshabilitado devuelve 503.
      security: *adminSecurity
      tags:
        - Biométrico y Control de Asistencia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - employee_id
              properties:
                employee_id:
                  type: string
                  example: "V-12345678"
                finger:
                  type: integer
                  minimum: 0
                  maximum: 9
                  example: 1
      responses:
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '400':
          $ref: '#/components/responses/BiometricFailure'
        '501':
          $ref: '#/components/responses/BiometricFailure'
        '503':
          $ref: '#/components/responses/BiometricFailure'

  /biometric/logs:
    get:
      summary: Consultar Registros de Asistencia
      description: >
        También /api/v1/biometric/logs. USB con Push habilitado consulta solo
        memoria Push; no lee hardware USB. En red exige una lectura TCP exitosa;
        nunca devuelve caché como éxito tras un fallo. Transferencias ZK por
        bloques no implementadas (501). Memoria volátil, no persistida.
      tags:
        - Biométrico y Control de Asistencia
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
            example: "2026-10-29T00:00:00Z"
      responses:
        '200':
          description: Lista de marcajes de asistencia recuperados
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success]
                  source:
                    type: string
                    enum: [push_memory, hardware_and_push_memory]
                  persistent:
                    type: boolean
                    enum: [false]
                  is_simulated:
                    type: boolean
                    enum: [false]
                  count:
                    type: integer
                  records:
                    type: array
                    items:
                      type: object
        '400':
          $ref: '#/components/responses/BiometricFailure'
        '500':
          $ref: '#/components/responses/BiometricFailure'
        '501':
          $ref: '#/components/responses/BiometricFailure'
        '503':
          $ref: '#/components/responses/BiometricFailure'
        '504':
          $ref: '#/components/responses/BiometricFailure'

  /biometric/push:
    post:
      summary: Receptor de Marcajes Push (ADMS y JSON)
      description: >
        También /api/v1/biometric/push e /iclock/cdata. Requiere enabled y
        push_enabled. Almacena marcajes solo en memoria, no verifica huellas.
        JSON admite objeto o array; fechas RFC3339. ADMS usa tabuladores y
        fechas interpretadas como UTC. Lotes inválidos se rechazan sin ingestión.
      tags:
        - Biométrico y Control de Asistencia
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
          application/json:
            schema:
              type: array
              items:
                type: object
      responses:
        '200':
          description: Marcajes válidos aceptados en memoria (volátil, no persistida)
        '400':
          $ref: '#/components/responses/BiometricFailure'
        '503':
          $ref: '#/components/responses/BiometricFailure'

components:
  securitySchemes:
    OperationalBearer:
      type: http
      scheme: bearer
      description: server.api_key. Obligatoria en rutas operativas fuera de loopback o si está configurada en loopback. La alternativa sin credencial solo aplica a loopback sin api_key; OpenAPI no expresa esta condición de despliegue. No sustituye server.admin_key.
    OperationalApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Alternativa a Authorization para server.api_key; mismas condiciones de bind. No concede administración.
    AdminSession:
      type: apiKey
      in: cookie
      name: omnibridge_admin_session
    AdminBearer:
      type: http
      scheme: bearer
      description: Clave server.admin_key independiente; solo bind loopback.
    AdminApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Clave server.admin_key, no la clave operativa del POS.
  responses:
    PrintDispatchFailure:
      description: Fallo de preparación o despacho al backend de impresión; no se confirma salida física ni se reenvía automáticamente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RequestFailure:
      description: Rechazo de autenticación, Origin, límites DEMO o extractor HTTP. Puede devolver JSON de aplicación o texto plano; verificar HTTP y no continuar el flujo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        text/plain:
          schema:
            type: string
    InvalidPrintRequest:
      description: JSON malformado, tipo incorrecto o contenido requerido ausente; no se despacha la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        text/plain:
          schema:
            type: string
    DispatchBusy:
      description: Capacidad de 4 workers agotada. Este despacho no fue enviado ni encolado; sin reintento automático.
      content:
        application/json:
          schema:
            type: object
            required: [status, message]
            properties:
              status:
                type: string
                enum: [error]
              message:
                type: string
    BiometricFailure:
      description: >
        Error explícito biométrico. 400 entrada inválida; 501 operación no
        implementada; 503 deshabilitado o no disponible; 504 timeout;
        500 fallo de protocolo o E/S. No devuelve plantillas ni éxito sintético.
      content:
        application/json:
          schema:
            type: object
            required: [status, message]
            properties:
              status:
                type: string
                enum: [error]
              message:
                type: string
    RawDispatchFailure:
      description: El cliente de impresión RAW rechazó el despacho, terminó por señal o no pudo ejecutarse. No se reenvía automáticamente ni se simula.
      content:
        application/json:
          schema:
            type: object
            required: [status, message]
            properties:
              status:
                type: string
                enum: [error]
              message:
                type: string
    RawDispatchTimeout:
      description: Timeout del despacho de impresión o gaveta. Aceptación no confirmada; revisar la cola antes de reintentar para evitar duplicados.
      content:
        application/json:
          schema:
            type: object
            required: [status, message]
            properties:
              status:
                type: string
                enum: [error]
              message:
                type: string
    AdminUnauthorized:
      description: Sesión/clave administrativa ausente, inválida, expirada o administración sin configurar.
      content:
        application/json:
          schema:
            type: object
            required: [status, message]
            properties:
              status:
                type: string
                enum: [error]
              message:
                type: string
    AdminForbidden:
      description: Bind no loopback, Origin externo o escritura con cookie/login sin Origin local del puerto principal.
      content:
        application/json:
          schema:
            type: object
            required: [status, message]
            properties:
              status:
                type: string
                enum: [error]
              message:
                type: string
  schemas:
    ErrorResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
      description: Errores de la aplicación y autenticación. Rechazos de extractores Axum (por ejemplo JSON de etiquetas/documentos o query de pesada inválidos) pueden devolver texto plano con HTTP 400/413/415/422; el cliente debe comprobar HTTP antes de interpretar el cuerpo.
    PrinterTestPageResponse:
      type: object
      required: [ok, status, message, printer_used, test_type]
      properties:
        ok:
          type: boolean
        status:
          type: string
        message:
          type: string
        printer_used:
          type: string
        test_type:
          type: string
    ConfigUpdate:
      type: object
      description: Todos los campos son opcionales. Omitir conserva el valor; null elimina overrides solo en scale_dtr, scale_rts, biometric_clock_ip y los dos identificadores USB. Listas vacias eliminan entradas. Credenciales solo en disco. Limites administrativos no implican homologacion del dispositivo. sumatra_args se guarda por compatibilidad; el motor usa argumentos internos seguros, no ejecuta esta plantilla.
      properties:
        scale_port:
          type: string
        scale_baud_rate:
          type: integer
          minimum: 1
          maximum: 4000000
        scale_timeout_ms:
          type: integer
          minimum: 1
          maximum: 60000
        scale_serial_format:
          type: string
          enum: [8N1, 7E1]
        scale_poll_command:
          type: string
          enum: [w_then_p, w]
        scale_dtr:
          type: boolean
          nullable: true
        scale_rts:
          type: boolean
          nullable: true
        scale_simulation_mode:
          type: boolean
        default_printer:
          type: string
        default_label_printer:
          type: string
        default_matrix_printer:
          type: string
        default_document_printer:
          type: string
        cors_origins:
          type: array
          items:
            type: string
        allowed_download_origins:
          type: array
          items:
            type: string
        server_host:
          type: string
          description: IP literal. Un bind no loopback exige api_key previamente configurada y bloquea la administracion tras reiniciar.
        server_port:
          type: integer
          minimum: 1
          maximum: 65535
        server_legacy_print_port:
          type: integer
          minimum: 0
          maximum: 65535
          description: 0 deshabilita. Puertos habilitados deben ser distintos.
        server_legacy_label_port:
          type: integer
          minimum: 0
          maximum: 65535
        sumatra_path:
          type: string
          maxLength: 4096
        sumatra_args:
          type: string
          maxLength: 4096
        extra_pos_keywords:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 128
        extra_label_keywords:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 128
        extra_matrix_keywords:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 128
        extra_document_keywords:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 128
        max_download_size_mb:
          type: integer
          minimum: 1
          maximum: 100
        print_timeout_sec:
          type: integer
          minimum: 1
          maximum: 300
        allow_private_network_downloads:
          type: boolean
          description: Amplia acceso a red privada; no elimina bloqueos incondicionales de loopback/metadata.
        biometric_enabled:
          type: boolean
        biometric_device_type:
          type: string
          enum: [network_clock, usb_desktop]
        biometric_clock_ip:
          type: string
          nullable: true
          description: IP literal o null para eliminar; obligatorio en reloj habilitado. Configuracion sanitizada representa ausencia como cadena vacia para mantenerla en TOML sin restaurar el default.
        biometric_clock_port:
          type: integer
          minimum: 1
          maximum: 65535
        biometric_usb_vendor_id:
          type: integer
          nullable: true
          minimum: 0
          maximum: 65535
          description: Decimal. Ambos VID/PID deben estar configurados o ambos ausentes.
        biometric_usb_product_id:
          type: integer
          nullable: true
          minimum: 0
          maximum: 65535
        biometric_push_enabled:
          type: boolean
        biometric_pull_interval_seconds:
          type: integer
          minimum: 1
          maximum: 86400
      additionalProperties: false
    WeightResponse:
      type: object
      required: [peso, weight, peso_leido, puerto, is_simulated, unit, is_stable]
      properties:
        peso:
          type: number
          format: float
          description: Peso numérico capturado.
          example: 1.250
        weight:
          type: number
          format: float
          description: Numeric weight captured (English alias for international clients).
          example: 1.250
        peso_leido:
          type: string
          description: Cadena sin procesar recibida del puerto serial.
          example: "01.250"
        puerto:
          type: string
          description: Puerto COM o serial utilizado.
          example: "COM3"
        is_simulated:
          type: boolean
          description: Flag que indica si la lectura proviene del emulador/simulador o de hardware físico.
          example: false
        unit:
          type: string
          enum: [kg, lb]
          description: Unidad indicada en la lectura.
          example: kg
        is_stable:
          type: boolean
          description: Solo es true para simulación configurable; lecturas físicas son false hasta validar estado estable por protocolo/modelo.
          example: false
        license:
          type: string
          description: Plan de licencia de la instancia.

    PrintResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          example: "ok"
        message:
          type: string
          example: "Documento impreso satisfactoriamente en 'POS-80'"
        printer_used:
          type: string
          nullable: true
          example: "POS-80"

    DrawerResponse:
      type: object
      required: [ok, status, message, is_simulated]
      properties:
        ok:
          type: boolean
          example: true
        status:
          type: string
          example: "ok"
        message:
          type: string
          example: "Pulso de apertura de gaveta de dinero enviado exitosamente a 'POS-80'"
        printer_used:
          type: string
          nullable: true
          example: "POS-80"
        is_simulated:
          type: boolean
          description: true indica simulación, no apertura física.

    LabelPrintRequest:
      type: object
      required:
        - commands
      properties:
        language:
          type: string
          description: Lenguaje de etiqueta (opcional, ej. TSPL, ZPL).
          example: "TSPL"
        printer:
          type: string
          description: Nombre específico de la impresora (opcional, si se omite auto-detecta).
          example: "3nStar 4B-2054L"
        commands:
          type: string
          description: Comandos RAW a enviar byte-a-byte.
          example: "SIZE 60 mm,45 mm\r\nPRINT 1,1\r\n"

    LabelPrintResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        mode:
          type: string
          description: Mecanismo de despacho empleado (DirectUSB, Spooler, UnixRaw o simulation).
          example: "DirectUSB"
        message:
          type: string
          example: "Etiqueta TSPL enviada exitosamente a la impresora '3nStar 4B-2054L'."
        detected_printer:
          type: string
          example: "3nStar 4B-2054L"

    MatrixPrintRequest:
      type: object
      anyOf:
        - required: [content]
        - required: [text]
        - required: [commands]
      description: Prioridad content, text, commands. Al menos un contenido no nulo; sin contenido devuelve HTTP 400.
      properties:
        content:
          type: string
        commands:
          type: string
        text:
          type: string
          description: Texto plano o comandos ESC/P a enviar en modo RAW a la impresora de matriz.
          example: "FACTURA NRO 001\r\n"
        printer:
          type: string
          description: Nombre específico de la impresora (opcional, auto-detecta si se omite).
          example: "Generic / Text Only"
        form_feed:
          type: boolean
          default: true
          description: Avanza la hoja al final mediante caracter ASCII Form Feed (\x0c).
          example: true

    MatrixPrintResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        mode:
          type: string
          description: Mecanismo de despacho empleado (Winspool-RAW o CUPS-RAW).
          example: "Winspool-RAW"
        message:
          type: string
          example: "Impresión de forma continua enviada exitosamente a 'Generic / Text Only'."
        detected_printer:
          type: string
          example: "Generic / Text Only"

    PrinterDetail:
      type: object
      properties:
        name:
          type: string
          example: "POS-80"
        is_default:
          type: boolean
          description: Es la impresora predeterminada en el sistema operativo.
          example: true
        is_pos:
          type: boolean
          description: Clasificada heurísticamente como impresora de tickets (80mm/58mm).
          example: true
        is_label:
          type: boolean
          description: Clasificada heurísticamente como impresora de etiquetas (TSPL/ZPL).
          example: false
        is_matrix:
          type: boolean
          description: Clasificada heurísticamente como impresora de matriz de punto / forma continua (Epson LX/FX/LQ, Oki, Generic Text).
          example: false
        is_document:
          type: boolean
          description: Clasificada heurísticamente como impresora láser, inyección de tinta o multifuncional de oficina (HP LaserJet, Epson EcoTank, Canon, Brother).
          example: true
        is_ready:
          type: boolean
          description: Reporta estado en línea y lista para recibir trabajos.
          example: true
        status:
          type: string
          example: "Normal"

    PrintersResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        default:
          type: string
          example: "POS-80"
        printers:
          type: array
          items:
            type: string
          example: ["POS-80", "3nStar 4B-2054L"]
        details:
          type: array
          items:
            $ref: '#/components/schemas/PrinterDetail'

    ScaleHealthInfo:
      type: object
      properties:
        configured_port:
          type: string
          example: "auto"
        active_port:
          type: string
          nullable: true
          example: "COM3"
        available_ports:
          type: array
          items:
            type: string
          example: ["COM1", "COM3"]
        baud_rate:
          type: integer
          example: 9600
        simulation_mode:
          type: boolean
          example: false

    PrinterHealthInfo:
      type: object
      properties:
        configured_default:
          type: string
          example: "POS-80"
        system_default:
          type: string
          nullable: true
          example: "POS-80C (Copy 1)"
        printers_detected:
          type: integer
          example: 2
        spooler_ready:
          type: boolean
          example: true

    LabelPrinterHealthInfo:
      type: object
      properties:
        configured_default:
          type: string
          example: "3nStar 4B-2054L"
        detected_printer:
          type: string
          nullable: true
          example: "3nStar 4B-2054L"

    MatrixPrinterHealthInfo:
      type: object
      properties:
        configured_default:
          type: string
          example: "Generic / Text Only"
        detected_printer:
          type: string
          nullable: true
          example: "Generic / Text Only"

    DocumentPrinterHealthInfo:
      type: object
      properties:
        configured_default:
          type: string
          example: "auto"
        detected_printer:
          type: string
          nullable: true
          example: "HP LaserJet Pro MFP M428fdw"

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        service:
          type: string
          example: "pos-peripherals-agent"
        version:
          type: string
          example: "0.1.0"
        scale:
          $ref: '#/components/schemas/ScaleHealthInfo'
        printer:
          $ref: '#/components/schemas/PrinterHealthInfo'
        label_printer:
          $ref: '#/components/schemas/LabelPrinterHealthInfo'
        matrix_printer:
          $ref: '#/components/schemas/MatrixPrinterHealthInfo'
        document_printer:
          $ref: '#/components/schemas/DocumentPrinterHealthInfo'
        scale_port:
          type: string
          example: "COM3"
        default_printer:
          type: string
          example: "POS-80C (Copy 1)"
        default_label_printer:
          type: string
          example: "3nStar 4B-2054L"
        default_matrix_printer:
          type: string
          example: "Generic / Text Only"
        default_document_printer:
          type: string
          example: "HP LaserJet Pro MFP M428fdw"
        simulation_mode:
          type: boolean
          example: false
