openapi: 3.0.3
info:
  title: OmniBridge POS — Peripherals Hardware Gateway API
  description: |
    API local escrita en Rust con rutas HTTP para los flujos seriales y de impresión implementados.
    El tamaño del binario, consumo de memoria, latencia y compatibilidad física por modelo no están
    certificados por esta especificación. Las lecturas físicas usan el baud rate configurado y un
    parser numérico genérico; la estabilidad física no se afirma sin un indicador de protocolo validado.
    Las solicitudes de navegador requieren un origen exacto configurado en `cors_origins`; la lista
    vacía y el comodín no autorizan orígenes. Al escuchar fuera de loopback, las rutas protegidas
    requieren `Authorization: Bearer <api_key>` o `x-api-key`. La apertura de gaveta es POST-only.
    Las descargas requieren una URL directa de PDF: no se siguen redirecciones y las direcciones
    resueltas se validan y fijan para la conexión.
    El configurador web y POST /api/v1/config permiten editar dos listas independientes:
    cors_origins (sitios que llaman a la API) y allowed_download_origins (servidores de PDF).
    Cada entrada es un origen HTTP/HTTPS sin rutas ni comodines; se requieren guardado y reinicio.
    Una lista explícita de CORS reemplaza los sitios históricos; [] revoca los sitios externos
    manteniendo el dashboard local. En descargas, [] conserva la política anti-SSRF existente;
    una lista no vacía restringe los servidores sin omitir las demás protecciones.
    Fuera de loopback, todos los alias health/status (incluidos los
    biométricos) requieren API key; ausencia o clave incorrecta devuelve HTTP 401.
    En loopback esos diagnósticos conservan su acceso sin clave. Los listeners
    legacy comparten estas reglas. GET /api/v1/health/live es público y devuelve
    solo {"status":"ok"} sin consultar hardware; la política de Origin sigue vigente.
    Panel, configuración, licencias, mantenimiento y enrolamiento requieren credencial
    administrativa independiente y bind loopback; fuera de loopback devuelven 403.
    El login local /admin/login establece una sesión HttpOnly/SameSite=Strict de 30 minutos;
    escrituras con cookie y login JSON exigen Origin local del puerto principal.
    Un Origin POS autorizado por CORS no concede acceso administrativo. Clientes nativos
    pueden usar la clave administrativa en Bearer o x-api-key sin Origin.
    Sin server.admin_key aleatoria de 32-256 bytes, distinta de api_key, administración
    bloqueada. Credenciales solo se configuran/rotan en disco con reinicio.
    Despacho RAW Linux/macOS (etiquetas, tickets RAW, matriz y gaveta, incluidos alias):
    éxito solo al terminar correctamente lpr -l; lp -o raw se usa únicamente si lpr
    no está instalado. HTTP 500 indica rechazo, señal o fallo de ejecución; HTTP 504
    indica timeout. No hay reenvío automático ni simulación implícita. El éxito no
    confirma impresión física o apertura de gaveta. Tras un timeout revisar la cola
    antes de reintentar para evitar duplicados. mock/simulator siguen siendo explícitos.
    Cada instancia limita a 4 workers simultáneos de despacho de impresión, gaveta,
    páginas de prueba y limpieza (incluidos alias y simulación). Agotados los cupos,
    devuelve HTTP 503 con status=error: ese despacho no fue enviado ni encolado.
    No hay reintento automático. Preparación de archivos y controles DEMO preceden
    a la admisión. El límite no controla uploads/descargas ni la cola del spooler.
    Timeout HTTP o cancelación del cliente no cancela el worker ya iniciado:
    conserva el cupo y archivo temporal hasta terminar. Pesada usa un bloqueo independiente.
  version: 1.2.0
  contact:
    name: Darwin Padrino
    email: drinowar@gmail.com
    url: https://github.com/dpadrino/pos-peripherals-agent
  license:
    name: Proprietary Commercial EULA (c) 2026 Darwin Padrino. All rights reserved.
    url: https://github.com/dpadrino/pos-peripherals-agent/blob/main/LICENSE.txt

servers:
  - url: http://127.0.0.1:8989
    description: Servidor Local Principal Unificado (Todos los periféricos)
  - url: http://127.0.0.1:8002
    description: Servidor Local Secundario (Retrocompatibilidad Tickets POS-80)
  - url: http://127.0.0.1:8003
    description: Servidor Local Secundario (Retrocompatibilidad Etiquetas TSPL / Cloud POS)

security:
  - {}
  - OperationalBearer: []
  - OperationalApiKey: []

tags:
  - name: Báscula (Scale)
    description: Lectura de peso en tiempo real desde balanzas seriales o USB.
  - name: Tickets POS
    description: Impresión silenciosa en PDF de tickets y comprobantes térmicos.
  - name: Gaveta de Dinero (Cash Drawer)
    description: Disparo y apertura de gavetas de dinero conectadas por RJ11/RJ12 a impresoras POS.
  - name: Etiquetas (Labels)
    description: Impresión de etiquetas de código de barras en formato RAW (TSPL / ZPL).
  - name: Forma Continua / Matriz
    description: Impresión de facturas y notas de remisión en texto plano / ESC/P para impresoras de impacto/agujas.
  - name: Documentos / Láser
    description: Impresión silenciosa de documentos de oficina, hojas membretadas y reportes ejecutivos (PDF, A4/Carta) en impresoras láser o de inyección de tinta.
  - name: Mantenimiento y Diagnóstico
    description: Catálogo de impresoras del SO, purga de colas y comprobación de salud.
  - name: Biométrico y Control de Asistencia
    description: Capacidades experimentales documentadas; no certifica captura USB ni enrolamiento.

